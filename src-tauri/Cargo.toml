[package]
name = "bluewing-native"
version = "0.1.0"
edition = "2024"
default-run = "bluewing-desktop"

[lib]
name = "bluewing_native"

[[bin]]
name = "bluewing-desktop"
path = "src/main.rs"

[[bin]]
name = "bluewing"
path = "src/bin/bluewing.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "hooks", "extra_check"] }
base64 = "0.22"
tempfile = "3"
directories = "6"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
percent-encoding = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
